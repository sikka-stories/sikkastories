<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="author" content="Shreyas Shinde">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sikka Stories</title>
<meta name="description" content="Free money lessons as short illustrated story books in English, Hindi and Marathi. You are the hero of every story.">
<meta name="theme-color" content="#ffd166">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sikka Stories">
<meta property="og:title" content="Sikka Stories: money stories where you are the hero">
<meta property="og:description" content="Free illustrated money stories for children in English, Hindi and Marathi.">
<meta property="og:image" content="https://sikka-stories.github.io/sikkastories/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://sikka-stories.github.io/sikkastories/">
<meta property="og:url" content="https://sikka-stories.github.io/sikkastories/">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap">
  <section class="hero2">
    <div class="herotext">
      <h1 id="h1"></h1>
      <p id="tag"></p>
      <p class="byline" id="byline"></p>
      <div id="herochip" class="chipwrap"></div>
      <p class="count" id="count"></p>
      <p class="order" id="order"></p>
      <p class="startrow"><a class="btn primary big" id="start" href="#"></a></p>
    </div>
    <div class="heroart" id="heroart" aria-hidden="true"></div>
  </section>

  <section class="how" aria-labelledby="how-t">
    <h2 class="section" id="how-t"></h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="peek" aria-labelledby="peek-t">
    <h2 class="section" id="peek-t"></h2>
    <div class="peekrow">
      <figure><img src="previews/story.webp" width="360" height="430" loading="lazy" alt="Story page from a Sikka Stories book"><figcaption id="peekc1"></figcaption></figure>
      <figure><img src="previews/quiz.webp" width="360" height="430" loading="lazy" alt="Quiz page with questions to answer"><figcaption id="peekc2"></figcaption></figure>
      <figure><img src="previews/promise.webp" width="360" height="430" loading="lazy" alt="Promise page that a child can sign"><figcaption id="peekc3"></figcaption></figure>
    </div>
  </section>

  <section class="stampsbar" id="stampsbar" hidden aria-live="polite"></section>

  <h2 class="section" id="lib"></h2>
  <div class="searchrow"><input type="search" id="q" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>

  <section class="about">
    <h2 id="about-t"></h2>
    <p id="about-p"></p>
  </section>
</main>
<footer id="foot"></footer>
<script src="books.js"></script>
<script src="strings.js"></script>
<script src="art.js"></script>
<script src="config.js"></script>
<script src="acct.js"></script>
<script src="app.js"></script>
<script src="index.js"></script>
</body>
</html>
